# Evolving crypto trading bots — all limits and settings.
# Secrets (KRAKEN_API_KEY, KRAKEN_API_SECRET, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID)
# come from environment variables only. Never put them in this file.

database_path: bots/data/bots.db

# ---------------------------------------------------------------------------
# Market data
# ---------------------------------------------------------------------------
data:
  exchange: kraken
  pairs: [BTC/USD, ETH/USD, SOL/USD, XRP/USD, LINK/USD, ADA/USD, DOGE/USD,
          NEAR/USD, LTC/USD, SUI/USD, AAVE/USD, UNI/USD, AVAX/USD, XLM/USD]  # liquid pairs whitelist
  timeframes: [15m, 1h, 4h]
  base_timeframe: 15m                    # stored; 1h and 4h are resampled from it
  history_years: 3                       # how far back to backfill (2–4)
  # Where old candles come from. Kraken only serves its latest 720 candles, so:
  #   coinbaseexchange - Coinbase USD candles, minutes per pair (prices within ~0.02% of Kraken)
  #   kraken_trades    - rebuild from Kraken's own trade history, ~4 hours per year of BTC
  # Recent candles and all trading always use Kraken.
  history_source: coinbaseexchange

# ---------------------------------------------------------------------------
# Backtest realism
# ---------------------------------------------------------------------------
backtest:
  # Kraken Pro spot taker fee for the lowest volume tier (Tier 1, $0+ 30-day
  # volume: 0.40% maker / 0.80% taker since 9 July 2026). The bots use market
  # orders, so they pay the taker rate. Re-check
  # https://www.kraken.com/features/fee-schedule now and then; set it lower only
  # if your account really sits in a higher tier.
  taker_fee_pct: 0.80
  maker_fee_pct: 0.40                    # Tier 1 maker rate; paid by resting limit entries
  slippage_pct: 0.05                     # per market fill, on top of assumed half spread
  spread_bps: 10                         # conservative full bid/ask spread assumption, 10 bps
  starting_balance_usd: 20               # matches max_per_bot_usd so sims face real minimums
  # Kraken minimum order sizes for the backtest. Deliberately on the strict
  # side; live trading takes the larger of these and the exchange's own limits.
  min_order:
    BTC/USD: {min_qty: 0.0001, min_cost_usd: 5}
    ETH/USD: {min_qty: 0.002, min_cost_usd: 5}
    SOL/USD: {min_qty: 0.02, min_cost_usd: 5}
    XRP/USD: {min_qty: 2, min_cost_usd: 5}
    LINK/USD: {min_qty: 0.2, min_cost_usd: 5}
    ADA/USD: {min_qty: 10, min_cost_usd: 5}
    DOGE/USD: {min_qty: 20, min_cost_usd: 5}
    # Kraken's own ordermin (Oct 2026); cost kept at the strict $5 used above.
    NEAR/USD: {min_qty: 1, min_cost_usd: 5}
    LTC/USD: {min_qty: 0.08, min_cost_usd: 5}
    SUI/USD: {min_qty: 5, min_cost_usd: 5}
    AAVE/USD: {min_qty: 0.03, min_cost_usd: 5}
    UNI/USD: {min_qty: 0.7, min_cost_usd: 5}
    AVAX/USD: {min_qty: 0.5, min_cost_usd: 5}
    XLM/USD: {min_qty: 25, min_cost_usd: 5}

# ---------------------------------------------------------------------------
# Order execution (backtest, paper and live use the same rule)
# ---------------------------------------------------------------------------
execution:
  # market: buy at once at the taker fee (default). limit: rest a buy at the bid
  # and pay the maker fee. Keep market until there is data that can prove limit
  # fills: on 15m+ candles the next bar opens at the previous close, so the
  # backtest's open-through rule fills almost no limit entries (0% on BTC), and
  # evolution then has no trades to learn from.
  entry_order: market
  limit_timeout_s: 120                   # cancel an entry that has not filled after this long
  limit_bid_offset_bps: 5                # historical prior-close bid proxy (half of assumed spread)
  limit_trade_through_bps: 2             # intrabar maker fills require strict trade-through
  # OHLC cannot prove a fill in 120 s when the chart bar is 15m, 1h or 4h.
  # Backtesting accepts only opening cross-through in that case; it may
  # undercount good resting fills rather than invent them.
  # Exits (stop, target, trailing, time, signal) are always market orders.

# ---------------------------------------------------------------------------
# Evolution
# ---------------------------------------------------------------------------
evolution:
  population_size: 200
  generations: 100
  split: {train: 0.6, validation: 0.2, test: 0.2}
  walk_forward_windows: 4                # train split cut into this many consecutive windows
  elite_fraction: 0.15                   # top 10–20% survive and breed
  death_fraction: 0.5                    # bottom 50% die each generation
  newcomer_fraction: 0.10                # random newcomers each generation
  mutation_rate: 0.3                     # per-gene probability of mutating
  mutation_scale: 0.10                   # ±10% on numeric genes
  # Maintain coverage across independent coin/strategy combinations without
  # relaxing validation, tests, or risk limits.
  max_elite_pair_share: 0.40             # cap one coin's share of elite parents if alternatives exist
  max_elite_family_share: 0.20           # cap one (coin, entry rule) family
  candidate_pool_fraction: 0.20         # rank and screen diverse top 20% before validation
  max_candidate_pair_share: 0.40
  max_candidate_family_share: 0.20
  bot_max_drawdown_pct: 25               # death: drawdown beyond this
  death_min_trades: 20                   # death: below starting balance after this many trades
  finalists: 5                           # candidates that get the one-time test-set check
  workers: 0                             # 0 = use all CPU cores
  seed: null
  # What a finalist must show before it spends its one-time unseen-data check
  # and before that check counts as passed. Stricter = fewer lucky bots reach
  # paper trading and waste 30 days there.
  gate:
    every_window_profitable: true        # profitable in each walk-forward train window on its own
    # Robustness: a bot must not be a lucky point in parameter space, and its
    # trade results must be distinguishable from chance.
    neighbours: 8                        # variants with numeric genes nudged by up to neighbour_scale
    neighbour_scale: 0.10                # +-10%
    neighbour_min_profitable: 0.6        # at least this share of variants must make money on train data
    min_trade_tstat: 2.0                 # mean trade return / its standard error over the train period
    min_tstat_trades: 10                 # fewer trades than this cannot be judged and fail the gate
    # Phase 4: evidence-first verification, never an assurance of profit.
    min_train_regimes: 2                 # at least two different historical market conditions
    embargo_hours: 24                   # skip first day after validation/test split
    min_validation_trades: 12           # meaningful sample of net filled trades
    max_validation_drawdown_pct: 10      # risk limit before spending an unseen-data test
    min_validation_profit_factor: 1.15  # after fees and both sides of the spread
    min_validation_sharpe: 0.0
    validation_subwindows: 3            # require consistency within validation, not only its total
    min_positive_validation_windows: 2
    require_cost_stress: true            # must survive more costly fills on validation only
    stress_fee_multiplier: 1.25
    stress_slippage_multiplier: 2
    stress_spread_multiplier: 2
    min_test_trades: 20                  # holdout evidence must include filled trades
    max_test_drawdown_pct: 10            # meaningful protection from historical deep losses
    min_test_profit_factor: 1.15
    min_test_sharpe: 0.0
    test_must_beat_hold: true            # after fees, outperform simply buying and holding
    max_new_test_attempts_per_epoch: 5   # limit search overfitting of a repeated 30-day holdout epoch

fitness:
  metric: sharpe                         # sharpe | calmar
  max_drawdown_pct: 15                   # penalty above this
  drawdown_penalty: 5.0                  # per unit of drawdown above the limit
  min_trades: 20                         # penalty below this
  trades_penalty: 3.0                    # scaled by the shortfall fraction. At 1.0, fees made
                                         # trading rarely the best score and evolution starved
  hold_penalty: 0.5                      # scaled by fraction of windows that failed to beat holding
  losing_window_penalty: 0.75            # steer search toward profit in all train windows
  unfilled_limit_penalty: 0.35           # don't reward unverified short-lived limit fills
  consistency_weight: 0.5                # fitness = mean(window scores) - w * std(window scores)

graveyard:
  similarity_radius: 0.04                # genome distance (0–1) counted as "too similar"
  saturation: 5                          # this many similar deaths of one cause = full penalty
  penalty: 0.5                           # max fitness penalty

# ---------------------------------------------------------------------------
# Pipeline gates (section 5)
# ---------------------------------------------------------------------------
graduation:
  min_paper_days: 30                   # actual elapsed time and forward-data observation span
  min_observed_days: 21                # real quote snapshots on 21 distinct UTC days
  max_observation_gap_hours: 72        # interruptions longer than 3 days block graduation
  max_paper_drawdown_pct: 10
  min_paper_trades: 20                 # reconciled buy + sell fills, not just a counter
  min_paper_profit_factor: 1.10        # realized net wins / losses
  must_beat_hold: true
  owner_approval_required: true

# ---------------------------------------------------------------------------
# RISK RULES (section 6). Non-negotiable. Ask the owner before changing.
# ---------------------------------------------------------------------------
# Mode is PAPER unless ALL THREE hold: env MODE=LIVE, live_enabled: true below,
# and LIVE_CONFIRMED.txt (project root) containing max_total_capital_usd typed
# by the owner. Missing or unclear anything -> PAPER.
live_enabled: false

# ---------------------------------------------------------------------------
# Phase 7 controlled real-money pilot. EVERY item is disabled until separately
# authorized after 30+ days of genuine PAPER trading and real Kraken testing.
# These switches are not authorization to bypass the original risk guard.
# ---------------------------------------------------------------------------
pilot:
  enabled: false
  owner_signoff: false                   # explicit owner approval of the funded pilot
  exchange_signoff: false                # must verify real Kraken permissions, fills and stops
  require_qualified_paper: true          # recheck original historical + forward evidence
  max_bots: 1                            # one strategy during initial pilot
  max_total_capital_usd: 0               # no capital assigned or orders allowed
  max_per_bot_usd: 20                    # subject to existing $100 hard application ceiling
  max_live_loss_usd: 2                   # kill the pilot at $2 total simulated/marked live loss
  max_live_drawdown_pct: 5               # demote pilot bot sooner than the standard 10%

# ---------------------------------------------------------------------------
# Phase 8: independently assess true live results before MANUAL capital review.
# Review is read-only; this software never allocates or scales funds itself.
# No shortcut based on backtest or paper profits, ever.
# ---------------------------------------------------------------------------
scaling:
  enabled: false                        # no capital scaling in current deployment
  owner_signoff: false                  # independent, later owner authorization
  max_total_capital_usd: 0              # cannot exceed app-wide $100 ceiling
  min_live_days: 60                     # real elapsed time AND witnessed equity-span
  min_observed_days: 45
  max_unobserved_days: 3
  min_live_trades: 30                   # reconciled REAL closed round trips
  min_profit_factor: 1.20
  min_net_return_pct: 5                 # actual net return, after actual recorded fees
  max_drawdown_pct: 5
  must_beat_hold: true

risk:
  max_total_capital_usd: 0               # 0 = paper only. Hard ceiling in code: 100
  max_per_bot_usd: 20
  max_live_bots: 3
  daily_loss_limit_usd: 3
  total_drawdown_kill_usd: 10
  house_money_multiple: 2                # at 2x allocation, original stake becomes protected
  heartbeat_hours: 2

# ---------------------------------------------------------------------------
# Paper trading (section 5, step 3) and the always-on worker
# ---------------------------------------------------------------------------
paper:
  allocation_usd: 20                     # fake money per paper bot
  max_bots: 10                           # paper bots running at once
  max_per_pair: 3                        # diversity: slots per coin ...
  max_per_entry_type: 3                  # ... and per entry rule
  candles: 720                           # recent candles fetched for signals
  retire_drawdown_pct: 25                # a paper bot this far under water retires

worker:
  poll_seconds: 60                       # trading loop interval
  market_refresh_seconds: 300           # refresh every listed pair independently every 5 min
  evolution_hour_utc: 2                  # nightly evolution
  daily_report_hour_utc: 8
  backup_hour_utc: 3
  backups_dir: backups
  backups_keep: 14
  offsite_backup: true                   # also send a copy (no candles) to your Telegram chat nightly
  healthy_ticks_to_resume: 3             # after an API/data error, healthy loops before new entries resume
  max_candle_age_multiple: 3             # latest closed candle older than this many timeframes = stale data

telegram:
  alert_throttle_minutes: 60

# ---------------------------------------------------------------------------
# AI analyst: a daily news briefing sent to you. Information only; the trading
# bots never read it. Uses Claude when ANTHROPIC_API_KEY is set, otherwise a
# plain headline digest.
# ---------------------------------------------------------------------------
analyst:
  enabled: true
  hour_utc: 7
  model: claude-opus-5-5
  effort: medium
  lookback_hours: 24
  max_items: 60
  rss_feeds:
    - https://www.coindesk.com/arc/outboundfeeds/rss/
    - https://cointelegraph.com/rss
    - https://decrypt.co/feed
  # Public Telegram channels you choose, by username (read from t.me/s/<name>,
  # no account login). Example: [some_news_channel]
  telegram_channels: []             # identical alerts are sent at most this often

dashboard:
  host: 0.0.0.0
  port: 8000                             # overridden by $PORT when set
