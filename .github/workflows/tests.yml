name: Bot Trading Tests

on:
  pull_request:
  push:
    branches: [main, feature/phase1-data-reliability]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Safety and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: PAPER
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q bots
      - name: Run full test suite
        run: python -m pytest -q
